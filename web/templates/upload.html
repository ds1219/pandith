<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Upload JPG</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='styles.css') }}"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #212529;
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 20px 0;
      }
      .upload-area {
        border: 2px dashed #6c757d;
        border-radius: 0.5rem;
        padding: 2rem;
        text-align: center;
        transition: border-color 0.3s;
        background-color: #343a40;
        cursor: pointer;
      }
      .upload-area:hover {
        border-color: #9333ea;
      }
      .upload-icon {
        height: 4rem;
        width: 4rem;
        color: #6c757d;
      }
      .history-card {
        max-height: 500px;
        overflow-y: auto;
      }
      .history-image {
        width: 5rem;
        height: 5rem;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card bg-dark text-white mb-4 shadow border-secondary">
            <div class="card-body">
              <h1
                class="card-title text-center text-purple mb-4"
                style="color: #a78bfa"
              >
                Upload a JPG File
              </h1>
              <form
                id="upload-form"
                method="post"
                enctype="multipart/form-data"
                action="{{ url_for('upload_file') }}"
              >
                <div id="upload-area" class="upload-area mb-4">
                  <input
                    type="file"
                    name="file"
                    accept=".jpg"
                    required
                    class="d-none"
                    id="file-input"
                  />
                  <label for="file-input" class="mb-0 w-100 h-100">
                    <div class="d-flex flex-column align-items-center">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="upload-icon mb-3"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                        />
                      </svg>
                      <span class="text-light fs-5" id="file-name">
                        Click or drag to upload JPG
                      </span>
                      <p class="text-muted small mt-2" id="upload-status">
                        Ready to upload
                      </p>
                    </div>
                  </label>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2"
                  style="background-color: #9333ea; border-color: #9333ea"
                >
                  Upload
                </button>
              </form>
            </div>
          </div>
          {% if history and history|length > 0 %}
          <div class="card bg-dark text-white shadow border-secondary">
            <div
              class="card-header"
              style="background-color: rgba(147, 51, 234, 0.2)"
            >
              <h2 class="h4 mb-0 text-center" style="color: #c4b5fd">
                History
              </h2>
            </div>
            <div class="card-body history-card">
              <div class="list-group list-group-flush bg-transparent">
                {% for item in history %}
                <div
                  class="list-group-item bg-dark text-white border-secondary d-flex align-items-center py-3"
                >
                  <img
                    src="{{ url_for('uploaded_file', filename=item.img) }}"
                    alt="Previous Upload"
                    class="history-image rounded me-3 border border-secondary"
                  />
                  <div class="flex-grow-1">
                    <div class="text-muted small font-monospace text-truncate">
                      {{ item.img }}
                    </div>
                    <div class="fs-5 fw-semibold">{{ item.txt }}</div>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='progress.js') }}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const fileInput = document.getElementById("file-input");
        const fileName = document.getElementById("file-name");
        fileInput.addEventListener("change", function () {
          if (fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
          } else {
            fileName.textContent = "Click or drag to upload JPG";
          }
        });
      });
    </script>
  </body>
</html>
